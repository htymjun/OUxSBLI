[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ouxsbli"
version = "0.0.2"
description = "Python API for the OUxSBLI CUDA Fortran CFD solver"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "fypp",
    "vtk",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ouxsbli*"]

