site_name: OUxSBLI
site_description: GPU-accelerated CFD solver for compressible flows — CUDA Fortran with Python API
site_url: https://htymjun.github.io/OUxSBLI/
repo_url: https://github.com/htymjun/OUxSBLI
repo_name: htymjun/OUxSBLI

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.integrate
    - search.highlight

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - md_in_html
  - tables

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - css/extra.css

exclude_docs: |
  plans/

nav:
  - Home: index.md
  - Quick Start: quickstart.md
  - Installation: installation.md
  - Configuration: configuration.md
  - AI Workflow: ai_development_workflow.md
  - Theory: theory.md
  - Python API: api.md
